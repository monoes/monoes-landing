<!doctype html>
<html lang="en" data-theme="A">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Monoes hero sample</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT,WONK@9..144,100..900,0..100,0..1&family=Figtree:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root,[data-theme="A"]{--surface:#F6F9FF;--raised:#fff;--ink:#101B35;--muted:#4A5878;--line:#D5DEF0;--a1:#D92E14;--a2:#2740E8;--glow:#BFD6FF;--glow2:#FFD6CC}
[data-theme="B"]{--surface:#F5FAF8;--raised:#fff;--ink:#221B3D;--muted:#575274;--line:#D3E6DF;--a1:#C74600;--a2:#6D28D9;--glow:#B7F0DC;--glow2:#FFE0C2}
[data-theme="C"]{--surface:#F9F7FF;--raised:#fff;--ink:#17183A;--muted:#53557A;--line:#E0DCF3;--a1:#3A4DFF;--a2:#F2B600;--glow:#DCCFFF;--glow2:#FFF0B8}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--surface);color:var(--ink);font:18px/1.55 Figtree,sans-serif;transition:background .5s,color .5s}
.hero{position:relative;min-height:100svh;display:grid;grid-template-rows:auto 1fr auto;overflow:hidden;isolation:isolate;
 background:radial-gradient(120% 80% at 85% -10%,var(--glow) 0,transparent 60%),radial-gradient(90% 70% at 0% 110%,var(--glow2) 0,transparent 55%),var(--surface)}
.grain{position:absolute;inset:0;z-index:-1;opacity:.05;pointer-events:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence baseFrequency='.9' numOctaves='2'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
nav{display:flex;align-items:center;justify-content:space-between;padding:20px clamp(16px,4vw,48px)}
.logo{font:800 22px Fraunces,serif;letter-spacing:-.02em}
.logo i{color:var(--a1);font-style:normal}
nav a{color:var(--muted);text-decoration:none;font-weight:500;margin-left:24px;padding:12px 0;display:inline-block}
nav a:hover,nav a:focus-visible{color:var(--ink)}
.stage{position:relative;display:grid;align-content:center;padding:0 clamp(16px,4vw,48px)}
.floor{position:absolute;inset:0;display:grid;grid-template-columns:repeat(var(--cols),1fr);grid-auto-rows:1fr;gap:10px;padding:8px clamp(16px,4vw,48px) 16px;z-index:-1;-webkit-mask-image:linear-gradient(90deg,rgba(0,0,0,.18) 0,rgba(0,0,0,.18) 30%,#000 62%);mask-image:linear-gradient(90deg,rgba(0,0,0,.18) 0,rgba(0,0,0,.18) 30%,#000 62%)}
.desk{border:1px dashed var(--line);border-radius:12px;display:grid;place-items:center;font:600 11px 'JetBrains Mono',monospace;color:transparent;transition:background .6s cubic-bezier(.22,1,.36,1),border-color .6s,color .6s,transform .6s cubic-bezier(.22,1,.36,1);min-height:44px}
.desk.on{background:var(--raised);border:1px solid var(--line);color:var(--muted);transform:translateY(-2px);box-shadow:0 6px 18px -8px color-mix(in srgb,var(--a2) 35%,transparent)}
.desk.on::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--a1);margin-right:6px}
.desk.on{grid-auto-flow:column}
.light{position:absolute;left:0;top:0;width:520px;height:520px;margin:-260px 0 0 -260px;border-radius:50%;pointer-events:none;z-index:-1;
 background:radial-gradient(circle,color-mix(in srgb,var(--glow2) 80%,transparent),transparent 65%);will-change:transform}
h1{margin:0;max-width:11ch;font:300 clamp(3.2rem,10vw,8.5rem)/.95 Fraunces,serif;letter-spacing:-.035em;font-variation-settings:'opsz' 144,'SOFT' 50,'WONK' 0;text-wrap:balance}
h1 b{font-weight:800;font-variation-settings:'opsz' 144,'SOFT' 100,'WONK' 1}
h1 .acc{color:var(--a1)}
.sub{max-width:44ch;margin:28px 0 32px;color:var(--muted);font-size:clamp(17px,1.6vw,20px)}
.doors{display:flex;flex-wrap:wrap;gap:12px}
.btn{display:inline-flex;align-items:center;gap:10px;min-height:52px;padding:0 26px;border-radius:999px;font-weight:700;text-decoration:none;color:var(--raised);background:var(--a1);transition:transform .4s cubic-bezier(.22,1,.36,1),box-shadow .4s}
.btn.two{background:var(--a2);color:var(--raised)}
[data-theme="C"] .btn.two{color:var(--ink)}
.btn:hover{transform:translateY(-3px);box-shadow:0 14px 30px -12px currentColor}
.btn:focus-visible,.sw button:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.btn code{font:600 13px 'JetBrains Mono',monospace;opacity:.85}
.foot{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;padding:18px clamp(16px,4vw,48px);font:400 13px 'JetBrains Mono',monospace;color:var(--muted)}
.count b{color:var(--ink)}
.sw{display:flex;gap:6px}
.sw button{font:600 13px 'JetBrains Mono',monospace;min-width:44px;min-height:44px;border-radius:999px;border:1px solid var(--line);background:var(--raised);color:var(--ink);cursor:pointer}
.sw button[aria-pressed="true"]{background:var(--ink);color:var(--raised)}
.rise{opacity:0;transform:translateY(24px);animation:rise .9s cubic-bezier(.22,1,.36,1) forwards}
@keyframes rise{to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.rise{animation:none;opacity:1;transform:none}.desk,.btn{transition:none}.light{display:none}}
@media (max-width:640px){.floor{gap:6px}.desk{font-size:0}}
</style>
</head>
<body>
<header class="hero">
  <div class="grain"></div>
  <nav aria-label="Primary"><span class="logo">mono<i>es</i></span><div><a href="#">Monomind</a><a href="#">Workforce</a><a href="#">Docs</a></div></nav>
  <div class="stage">
    <div class="floor" id="floor" aria-hidden="true"></div>
    <div class="light" id="light" aria-hidden="true"></div>
    <div>
      <h1 class="rise" style="animation-delay:.1s">Your company, <b>staffed</b> by <b class="acc">sunrise.</b></h1>
      <p class="sub rise" style="animation-delay:.3s">PLACEHOLDER_COPY: autonomous AI teams you can run yourself for free, or hire us to run for your business.</p>
      <div class="doors rise" style="animation-delay:.45s">
        <a class="btn" href="#">Self-host free <code>npx monomind</code></a>
        <a class="btn two" href="#">Hire the team &rarr;</a>
      </div>
    </div>
  </div>
  <div class="foot">
    <span class="count" aria-live="off">Desks staffed <b id="n">0</b> / <span id="t">0</span> &middot; move your pointer</span>
    <div class="sw" role="group" aria-label="Palette"><button aria-pressed="true" data-p="A">A</button><button aria-pressed="false" data-p="B">B</button><button aria-pressed="false" data-p="C">C</button></div>
  </div>
</header>
<script>
const roles=['Invoices','Onboarding','Reconcile','Payroll','Support','Contracts','Recruiting','Reporting','Compliance','Procurement','Collections','Expenses'];
const floor=document.getElementById('floor'),light=document.getElementById('light');
const reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
let desks=[],rects=[];
function build(){
  floor.innerHTML='';desks=[];
  const w=innerWidth,cols=w<640?5:w<1100?8:12,rows=w<640?9:6;
  floor.style.setProperty('--cols',cols);
  for(let i=0;i<cols*rows;i++){const d=document.createElement('div');d.className='desk';d.dataset.r=roles[(i*7)%roles.length];d.textContent=d.dataset.r;floor.appendChild(d);desks.push(d)}
  document.getElementById('t').textContent=desks.length;
  measure();
  if(reduce)desks.forEach(d=>d.classList.add('on'));
  count();
}
function measure(){const f=floor.getBoundingClientRect();rects=desks.map(d=>{const r=d.getBoundingClientRect();return[r.left-f.left+r.width/2,r.top-f.top+r.height/2]})}
function count(){document.getElementById('n').textContent=desks.filter(d=>d.classList.contains('on')).length}
let tx=0,ty=0,x=0,y=0,idle=0,last=performance.now(),t0=last;
addEventListener('pointermove',e=>{const f=floor.getBoundingClientRect();tx=e.clientX-f.left;ty=e.clientY-f.top;idle=0});
addEventListener('resize',build);
function tick(now){
  const dt=now-last;last=now;idle+=dt;
  if(idle>2500){const f=floor.getBoundingClientRect(),s=(now-t0)/1000;tx=f.width*(.5+.42*Math.sin(s*.45));ty=f.height*(.5+.38*Math.sin(s*.31+1))}
  x+=(tx-x)*.08;y+=(ty-y)*.08;
  light.style.transform=`translate(${x}px,${y+floor.offsetTop}px)`;
  let changed=false;
  for(let i=0;i<desks.length;i++){const dx=rects[i][0]-x,dy=rects[i][1]-y;if(dx*dx+dy*dy<150*150&&!desks[i].classList.contains('on')){desks[i].classList.add('on');changed=true}}
  if(changed)count();
  requestAnimationFrame(tick);
}
build();
if(!reduce){x=tx=innerWidth*.6;y=ty=200;requestAnimationFrame(tick)}
document.fonts.ready.then(measure);
document.querySelectorAll('.sw button').forEach(b=>b.onclick=()=>{
  document.documentElement.dataset.theme=b.dataset.p;
  document.querySelectorAll('.sw button').forEach(o=>o.setAttribute('aria-pressed',o===b));
});
</script>
</body>
</html>
