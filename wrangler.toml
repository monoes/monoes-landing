name = "monoes-landing"
compatibility_date = "2025-04-17"
compatibility_flags = ["nodejs_compat"]
main = ".open-next/worker.js"

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

routes = [
  { pattern = "monoes.me/*", zone_name = "monoes.me" },
  { pattern = "www.monoes.me/*", zone_name = "monoes.me" }
]

[[d1_databases]]
binding = "COMMUNITY_DB"
database_name = "monoes-community"
database_id = "00000000-0000-0000-0000-000000000000" # TODO: replace with the real ID from `wrangler d1 create monoes-community`
migrations_dir = "drizzle"
