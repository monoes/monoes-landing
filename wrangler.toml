name = "monoes-landing"
compatibility_date = "2025-04-17"
compatibility_flags = ["nodejs_compat"]
main = ".open-next/worker.js"

routes = [
  { pattern = "monoes.me/*", zone_name = "monoes.me" },
  { pattern = "www.monoes.me/*", zone_name = "monoes.me" }
]

[assets]
directory = ".open-next/assets"
binding = "ASSETS"
# Cloudflare serves matching static assets directly at the edge, bypassing
# the Worker (and Next.js middleware) entirely by default — which silently
# defeats the Markdown-for-Agents content negotiation in src/middleware.ts
# for every prerendered static page (home, blog posts, projects/*, etc).
# Force the Worker to run first for page-like paths so middleware always
# gets a chance to intercept; exclude bulky binary/static asset paths from
# this to avoid adding Worker latency to every image/font/JS chunk load.
run_worker_first = [
  "/*",
  "!/_next/static/*",
  "!/_next/image*",
  "!/images/*",
  "!/fonts/*",
  "!/*.ico",
  "!/*.png",
  "!/*.jpg",
  "!/*.jpeg",
  "!/*.svg",
  "!/*.mp4",
  "!/*.webmanifest",
]

[[d1_databases]]
binding = "COMMUNITY_DB"
database_name = "monoes-community"
database_id = "44ea2f4e-33a9-4a1e-a529-f1cec3b24d38"
migrations_dir = "drizzle"

[[r2_buckets]]
binding = "AVATARS"
bucket_name = "monoes-community-avatars"

[[r2_buckets]]
binding = "ORG_FILES"
bucket_name = "monoes-community-org-files"
